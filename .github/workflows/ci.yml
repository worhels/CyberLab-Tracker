name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Typecheck backend
        run: pyright --pythonpath "$(command -v python)"

      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET_KEY: "ci-only-secret-for-tests-with-safe-length"
        run: pytest

      - name: Compile backend
        working-directory: backend
        run: python -m compileall app scripts alembic

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install E2E browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Test local browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/e2e/**/*-linux.png
            output/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberlab_tracker_ci
          POSTGRES_USER: cyberlab
          POSTGRES_PASSWORD: cyberlab-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberlab -d cyberlab_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://cyberlab:cyberlab-ci-password@localhost:5432/cyberlab_tracker_ci
      JWT_SECRET_KEY: ci-only-secret-for-migrations-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify model and migration parity
        working-directory: backend
        run: alembic check

      - name: Verify migration reversibility
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        id: dependency-review
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Explain dependency review fallback
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review requires GitHub Dependency graph to be enabled for this repository. Keeping this workflow non-blocking until repository security settings are enabled."

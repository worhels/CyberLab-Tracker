name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Build release artifacts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cyberlab_tracker_release
          POSTGRES_USER: cyberlab
          POSTGRES_PASSWORD: cyberlab-release-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberlab -d cyberlab_tracker_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install and test backend
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET_KEY: release-validation-secret-at-least-32-chars
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check .
          pyright --pythonpath "$(command -v python)"
          pip-audit -r requirements.txt
          pytest

      - name: Verify release migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://cyberlab:cyberlab-release-password@localhost:5432/cyberlab_tracker_release
          JWT_SECRET_KEY: release-migration-secret-at-least-32-chars
        run: |
          alembic upgrade head
          alembic check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm test
          npm run typecheck
          npm run lint
          npm run build

      - name: Package frontend
        run: |
          mkdir -p release-package
          cp -R frontend/dist release-package/dist
          cp LICENSE release-package/LICENSE
          tar -czf "cyberlab-tracker-frontend-${GITHUB_REF_NAME}.tar.gz" -C release-package .
          sha256sum "cyberlab-tracker-frontend-${GITHUB_REF_NAME}.tar.gz" > checksums.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/worhels/cyberlab-tracker-api:${{ github.ref_name }}
            ghcr.io/worhels/cyberlab-tracker-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=CyberLab Tracker API
            org.opencontainers.image.description=FastAPI backend for CyberLab Tracker

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cyberlab-tracker-frontend-${GITHUB_REF_NAME}.tar.gz" \
            checksums.txt \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "CyberLab Tracker ${GITHUB_REF_NAME}"
